schema_version: "1.0"

extension:
  id: "keel"
  name: "Keel Discovery"
  version: "0.2.0"
  description: "Evidence-backed discovery upstream of speckit.specify, plus round-trip drift auditing after implementation."
  author: "Keel Discovery"
  repository: "https://github.com/keeldiscovery/spec-kit-keel"
  license: "Apache-2.0"
  effect: "read-write"

requires:
  speckit_version: ">=0.15.0"

provides:
  commands:
    - name: "speckit.keel.guide"
      file: "commands/guide.md"
      description: "State-aware entry point: detects the current discovery phase and guides you to the next action"
    - name: "speckit.keel.init"
      file: "commands/init.md"
      description: "Capture the hypothesis, derive assumptions, write a non-leading interview guide"
    - name: "speckit.keel.add-evidence"
      file: "commands/add-evidence.md"
      description: "Ingest one interview, extract claims with provenance, update assumption confidence"
    - name: "speckit.keel.check"
      file: "commands/check.md"
      description: "Report coverage, saturation, contradictions, and one recommended next action"
    - name: "speckit.keel.brief"
      file: "commands/brief.md"
      description: "Write constitution input and an evidence-backed brief for /speckit.specify"
    - name: "speckit.keel.audit"
      file: "commands/audit.md"
      description: "Score spec quality; with keel/ present, diff the build against the evidence"

  config:
    - name: "keel-config.yml"
      template: "keel-config.template.yml"
      description: "Evidence thresholds and gate behavior"
      required: false

hooks:
  before_plan:
    command: "speckit.keel.check"
    optional: true
    prompt: "Keel: verify the spec is backed by evidence before planning?"
    description: "Surfaces a coverage/saturation check before planning. Not run automatically: a project with no keel/ directory must not be blocked by a hook it never opted into. keel-gate.sh is what actually enforces, and only once keel/ exists."
  after_implement:
    command: "speckit.keel.audit"
    optional: true
    prompt: "Keel: audit the implementation against the original evidence?"
    description: "Round-trip drift check between shipped code and approved intent."

tags:
  - "discovery"
  - "evidence"
  - "traceability"

config:
  defaults:
    min_evidence_per_high_risk_assumption: 3
    min_distinct_sources: 2
    block_on_unvalidated_high_risk: true

# Spec Kit extension manifest, keel-cloud `canon/designs/keel-skill-design.md` §8.4, verbatim.
#
# `2.3.1` is the only substitution `make dist` performs anywhere in this tree; every other
# byte of the built extension is copied (§8.1). One version, everywhere (D7).
#
# **No behaviour in a manifest** (D6): this file declares a name, a version, a path and a
# description, and nothing that could make the extension behave differently from a bare drop of
# the same skill. No `hooks` (decision 15), no `config`, no `templates`, and no environment
# variable anywhere.
#
# `provides.scripts` names the connect script only. `keel_disconnect.py` ships in the tree beside
# it and is reached the way the skill reaches it -- by the agent running the path `SKILL.md` names
# -- because Spec Kit's `scripts` list is what the *commands* declare, and only
# `speckit.keel.connect` runs one. `speckit.keel.brief` declares none at all: it is a prompt, and
# there is nothing to run.
schema_version: "1.0"
extension:
  id: keel
  name: Keel Connect
  version: 2.3.1
  description: Connect the local Keel runtime to Keel Cloud without leaving your agent.
  author: Keel Discovery
  repository: https://github.com/keeldiscovery/spec-kit-keel
  license: Apache-2.0
requires:
  speckit_version: ">=1.0.0,<2.0.0"
  tools:
    - { name: python3, version: ">=3.9", required: true }
provides:
  commands:
    - { name: speckit.keel.connect, file: commands/connect.md,
        description: Check whether the local Keel runtime is connected, and start it if not. }
    - { name: speckit.keel.brief, file: commands/brief.md,
        description: Read what Keel has learned about this idea into the spec, in the founder's own words. }
  scripts:
    - { name: keel-connect-check, file: scripts/keel_connect_check.py, runtimes: [python] }
tags: [keel, runtime, connect, agent, infrastructure]
